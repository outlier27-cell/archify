name: Share generated artifact feedback
description: Share a reader-facing issue without attaching private source material.
title: "[Artifact feedback]: "
labels:
  - feedback
body:
  - type: markdown
    attributes:
      value: |
        This form is for a generated Archify HTML artifact. Paste only the optional diagnostic context you chose to copy. Do not include credentials, private source, repository paths, or customer data.
  - type: dropdown
    id: feedback_kind
    attributes:
      label: What would you like to report?
      options:
        - Reader usability or accessibility
        - Rendering or layout problem
        - Feedback and update controls
        - Other artifact experience
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe what you expected and what you observed. Screenshots are welcome when they clarify a visual issue.
    validations:
      required: true
  - type: textarea
    id: diagnostic_context
    attributes:
      label: Optional copied diagnostic context
      description: Paste only the local context generated by the artifact, after reviewing it.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private source, file paths, and personal or customer data.
          required: true
