name: Story Linux diagnostic
on:
  workflow_dispatch:
  push:
    branches: ['codex/diagnose-story-linux-20261125']
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          package-manager-cache: false
          node-version: 22
      - id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Reproduce and record exported WebM
        run: node --test --test-name-pattern='story SVGs render' test/story-choreography-browser.test.mjs
        env:
          ARCHIFY_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          ARCHIFY_CHROME_NO_SANDBOX: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-linux-webm
          path: story-linux-diagnostic.webm
          if-no-files-found: warn
